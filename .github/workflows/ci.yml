name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Gate 1 — schema
      - name: Validate content
        run: npm run validate

      # Types
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build

      # Gate 2 — performance budget. A 3D site that fails this is not shippable.
      - name: Performance budget
        run: npm run budget

      # Gate 3 — write scope, agent PRs only
      - name: Agent write scope
        if: startsWith(github.head_ref, 'agent/')
        run: |
          AGENT="${GITHUB_HEAD_REF#agent/}"
          AGENT="${AGENT%%/*}"
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          node scripts/check-scope.mjs "$AGENT" $FILES
