name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Agent branches are gated inside the agent job itself — validate,
    # provenance, escalation and scope all run there, before the pull request
    # exists. Running them again here adds nothing, and a bot-authored PR sits
    # awaiting manual approval, which blocks the merge.
    branches-ignore:
      - 'agent/**'

jobs:
  gates:
    # Belt and braces: skip anything the bot raised, however it was branched.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Self-test the agent IO layer
        run: npm run test:agent

      - name: Validate content
        run: npm run validate

      - name: Provenance
        run: npm run provenance

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx vite build

      - name: Performance budget
        run: npm run budget
