name: Agents

on:
  schedule:
    # Weekly, Monday 06:00 UTC. Individual agents decide whether they are due.
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      agent:
        description: 'Agent to run (blank = all due)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.list.outputs.agents }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        name: Find agents that are due
        run: |
          if [ -n "${{ inputs.agent }}" ]; then
            echo "agents=[\"${{ inputs.agent }}\"]" >> $GITHUB_OUTPUT
            exit 0
          fi
          DUE=$(node -e '
            const fs=require("fs");
            const week=Math.floor(Date.now()/6048e5);
            const out=fs.readdirSync("agents").filter(d=>fs.existsSync(`agents/${d}/agent.json`))
              .filter(d=>{
                const c=JSON.parse(fs.readFileSync(`agents/${d}/agent.json`,"utf8"));
                if(!c.enabled) return false;
                const every=c.everyWeeks??1;
                // 0 means never scheduled — a campaign agent, run by hand.
                if(every===0) return false;
                return week % every === 0;
              });
            console.log(JSON.stringify(out));
          ')
          echo "agents=$DUE" >> $GITHUB_OUTPUT

  run:
    needs: discover
    if: needs.discover.outputs.agents != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # One PR per agent. A single PR mixing agents is unreviewable.
      max-parallel: 1
      fail-fast: false
      matrix:
        agent: ${{ fromJson(needs.discover.outputs.agents) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install

      # These helpers have broken twice in ways only a live run revealed.
      # Eleven seconds here beats another round trip.
      - name: Self-test the agent IO layer
        run: npm run test:agent

      - name: Clear the inbox
        run: |
          find content/frontier/_inbox -name '*.md' ! -name 'README.md' -delete || true

      - name: Run ${{ matrix.agent }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/run-agent.mjs ${{ matrix.agent }}

      # The runner validates each file against the schema before writing, so
      # anything reaching this point is already well formed. This checks the
      # board as a whole is still consistent.
      - name: Validate the board
        run: npm run validate

      - name: Keep the run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.agent }}-run-${{ github.run_number }}
          path: .agent-run/
          # .agent-run is a dot-directory, which this action skips unless told
          # otherwise — which is why the record was never actually uploaded.
          include-hidden-files: true
          retention-days: 90

      # The runner records exactly which files it wrote, so this needs no git
      # history. BASE_REF remains only as a fallback.
      - name: Provenance and escalation check
        env:
          BASE_REF: origin/main
        run: node scripts/check-provenance.mjs --agent ${{ matrix.agent }}

      - name: Write scope check
        run: |
          FILES=$(cat .agent-run/written.txt 2>/dev/null | tr '\n' ' ')
          if [ -z "$FILES" ]; then
            echo "Nothing written; nothing to scope-check."
            exit 0
          fi
          node scripts/check-scope.mjs ${{ matrix.agent }} $FILES

      # Publish first, veto after. Every merged item is labelled agent-merged
      # and says so on the board until a human confirms it.
      - name: Merge and publish
        if: success()
        run: |
          COUNT=$(cat .agent-run/count.txt 2>/dev/null || echo 0)
          if [ "$COUNT" -eq 0 ]; then
            echo "Nothing proposed. Nothing to merge."
            exit 0
          fi
          git config user.name "horizonq-agent"
          git config user.email "agent@users.noreply.github.com"
          # Proposals move from the inbox onto the board.
          for f in content/frontier/_inbox/*.md; do
            [ "$(basename $f)" = "README.md" ] && continue
            mv "$f" content/frontier/
          done
          npm run validate
          node scripts/check-provenance.mjs
          BRANCH="agent/${{ matrix.agent }}/$(date +%Y-%m-%d-%H%M)"
          git checkout -b "$BRANCH"
          git add content/frontier
          git commit -m "${{ matrix.agent }}: $COUNT item(s), agent-merged"
          git push origin "$BRANCH"
          # A pull request gives the cleanest veto — GitHub's own Revert button.
          # If the repo forbids Actions from opening one, fall back to pushing
          # straight to main rather than stranding finished work on a branch.
          if PR=$(gh pr create --title "${{ matrix.agent }}: $COUNT item(s)" \
                               --body-file .agent-run/pr-body.md \
                               --base main --head "$BRANCH" 2>&1); then
            # --admin bypasses the pending checks. CI on a bot-authored PR
            # sits awaiting manual approval, and the same gates have already
            # run in this job — validate, provenance, escalation, scope.
            gh pr merge "$PR" --squash --admin --delete-branch
            echo "MERGED_PR=$PR" >> $GITHUB_ENV
          else
            echo "::warning::Could not open a pull request. Pushing to main directly."
            echo "::warning::Enable Settings > Actions > General > Allow GitHub Actions to create and approve pull requests, for one-click veto."
            echo "$PR"
            git checkout main
            git merge --squash "$BRANCH"
            git commit -m "${{ matrix.agent }}: $COUNT item(s), agent-merged"
            git push origin main
            git push origin --delete "$BRANCH" || true
            echo "MERGED_PR=$(git rev-parse HEAD)" >> $GITHUB_ENV
            echo "DIRECT_PUSH=1" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Log the run whether or not anything changed.
      #
      # This used to fire only when files merged, which meant a reviewer run
      # reporting "eight checked, nothing to correct, one thing needs you"
      # produced no issue at all — and the escalation was lost. For an agent
      # whose normal outcome is no change, that is precisely backwards.
      - name: Log the run
        if: success()
        run: |
          COUNT=$(cat .agent-run/count.txt 2>/dev/null || echo 0)
          TITLE="Review queue - week of $(date +%Y-%m-%d)"

          if [ -n "$MERGED_PR" ]; then
            if [ -n "$DIRECT_PUSH" ]; then
              VETO="revert commit $MERGED_PR"
            else
              VETO="use the Revert button on $MERGED_PR"
            fi
            HEAD="## ${{ matrix.agent }} - $COUNT item(s), merged and live"
            LINKS="$MERGED_PR

          - Confirm: Actions → Confirm or veto → \`mark-reviewed\`
          - Veto: $VETO"
          else
            HEAD="## ${{ matrix.agent }} - ran, nothing changed"
            LINKS="_No files written. The summary below is the result._"
          fi

          {
            echo "$HEAD"
            echo
            echo "$LINKS"
            echo
            echo "---"
            echo
            cat .agent-run/pr-body.md 2>/dev/null || echo "_No summary returned._"
          } > /tmp/issue-body.md

          EXISTING=$(gh issue list --search "$TITLE" --state open --json number,title \
                     --jq ".[] | select(.title==\"$TITLE\") | .number" | head -1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file /tmp/issue-body.md
          else
            gh issue create --title "$TITLE" --body-file /tmp/issue-body.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
